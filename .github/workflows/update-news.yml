name: Update news

on:
  schedule:
    - cron: "5 * * * *"      # every hour
  workflow_dispatch:          # lets you press a "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch newspaper headlines
        run: node fetch-news.js
      - name: Save news.json
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "Update news" && git push)
